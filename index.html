<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Register</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-[#23272e]">
    <!-- container -->
    <div
      class="flex relative items-center overflow-hidden justify-center lg:w-[30%] w-1/2 h-dvh m-auto"
    >
      <!-- login -->
      <div id="login" class="container translate-x-[150%]">
        <h1 class="title">Login</h1>
        <form action="">
          <div>
            <input type="email" placeholder="Email" name="email" required />
            <small class="validate" id="login-email"></small>
          </div>
          <div>
            <div class="password-input-wrapper">
              <input
                type="password"
                placeholder="Password"
                name="password"
                required
              />
              <span class="toggle-password"></span>
            </div>
            <small class="validate" id="login-password"></small>
          </div>
          <button type="submit" class="main-btn">Login</button>
        </form>
        <button value="rejister" class="link">
          Dont have an account? create one
        </button>
      </div>
      <!-- rejister -->
      <div id="rejister" class="container">
        <h1 class="title">Registration</h1>
        <form action="">
          <input type="text" placeholder="Name" name="name" required />
          <div>
            <input type="email" placeholder="Email" name="email" required />
            <small class="validate" id="rejister-email"></small>
          </div>

          <div class="password-input-wrapper">
            <input
              type="password"
              placeholder="Password"
              name="password"
              required
            />
            <span class="toggle-password"
              ><i class="fa-regular fa-eye-slash"></i
            ></span>
          </div>
          <button type="submit" class="main-btn">Create Account</button>
        </form>
        <button value="login" class="link">
          Already have an account? login
        </button>
      </div>
    </div>
    <!-- profile page -->
    <div id="user-page">
      <div class="container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Password</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div id="toast">acount created sucessfully</div>

    <script src="./app.js"></script>
  </body>
</html>
